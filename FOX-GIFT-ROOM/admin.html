<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101316"><title>FOX GIFT | الإدارة</title>
<style>
:root{color-scheme:dark;--line:#303a40;--orange:#ff8b32;--gold:#ffc16b;--muted:#9ca8ae;--white:#f5f7f8;--green:#64d6a0;--red:#ff7777}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#553019 0,transparent 42%),linear-gradient(145deg,#0b0e10,#11171b 60%,#0b0e10);color:var(--white);font-family:system-ui,Arial,sans-serif;padding:18px}.shell{width:min(100%,950px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#ffb45c,#d95b1d);color:#20140d;font-size:24px;font-weight:1000}.brand b{display:block;letter-spacing:2px}.brand small{color:var(--muted);font-size:10px;letter-spacing:1.3px}a{color:var(--gold);text-decoration:none}.panel{background:linear-gradient(150deg,#1a2024,#12171a);border:1px solid var(--line);border-radius:17px;padding:22px;margin:15px 0;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent)}h1{font-size:clamp(25px,5vw,35px)}h2{font-size:15px;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;color:#d7dfe2;font-size:12px;margin-bottom:8px}.field input{width:100%;height:47px;border:1px solid #354148;border-radius:10px;background:#0e1316;color:white;padding:0 12px;font:inherit}.wide{grid-column:1/-1}button{font:inherit;cursor:pointer;border-radius:10px;font-weight:850}.primary{height:49px;border:0;background:linear-gradient(100deg,#d96a22,#ffad4d);color:#21150d}.secondary{padding:8px 11px;border:1px solid var(--line);background:#ffffff08;color:#eee;font-size:12px}.danger{border-color:#793b3b;color:#ff9999}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:13px}.stat small{color:var(--muted)}.stat strong{display:block;color:var(--gold);font-size:25px;margin-top:4px}.status{min-height:22px;color:var(--green);font-size:12px;margin-top:10px}.list{display:grid;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.code{direction:ltr;color:var(--gold);font-weight:900;letter-spacing:1px}.meta{color:var(--muted);font-size:11px;margin-top:5px}.actions{display:flex;gap:7px}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.hint{color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:21px}.panel{padding:16px}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><div class="mark">狐</div><div><b>FOX GIFT</b><small>ADMIN CONTROL CENTER</small></div></div><a href="./">العودة للمولّد ↗</a></header>
<h1>لوحة إدارة الهدايا</h1><p class="hint">أنشئ أكوادك الخاصة وحدد معامل الضرب والمكافأة وعدد المستخدمين والصلاحية.</p>
<section class="panel"><h2>مفتاح الإدارة</h2><div class="field"><label for="key">Admin Key</label><input id="key" type="password" autocomplete="current-password" placeholder="أدخل مفتاح الإدارة من Termux"></div><p class="hint">لا تشارك هذا المفتاح.</p></section>
<section class="panel"><h2>إحصائيات النظام</h2><div class="stats"><div class="stat"><small>الأكواد</small><strong id="total">—</strong></div><div class="stat"><small>المفعّلة</small><strong id="active">—</strong></div><div class="stat"><small>المطالبات</small><strong id="claims">—</strong></div></div><button class="secondary" id="refresh" style="margin-top:14px">تحديث البيانات</button></section>
<section class="panel"><h2>إنشاء كود جديد</h2><form id="create" class="grid">
<div class="field"><label for="code">رمز الهدية</label><input id="code" required maxlength="32" placeholder="FOXWELCOME" dir="ltr"></div>
<div class="field"><label for="multiplier">معامل الضرب</label><input id="multiplier" type="number" min="1" max="999999" value="1234" required></div>
<div class="field"><label for="credits">قيمة الرصيد</label><input id="credits" type="number" min="1" max="1000000" value="500" required></div>
<div class="field"><label for="uses">عدد المستخدمين</label><input id="uses" type="number" min="1" max="100000" value="100" required></div>
<div class="field"><label for="days">الصلاحية بالأيام</label><input id="days" type="number" min="1" max="365" value="7" required></div>
<button class="primary wide" type="submit">＋ إنشاء الكود</button></form><div class="status" id="status" role="status"></div></section>
<section class="panel"><h2>قائمة الأكواد</h2><div class="list" id="list"><div class="empty">أدخل مفتاح الإدارة ثم حدّث البيانات.</div></div></section></div>
<script>
const $=id=>document.getElementById(id),key=()=>$("key").value.trim();
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Admin-Key":key()},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"فشل الطلب");return d}
async function refresh(){try{const d=await api("/api/admin/list");$("total").textContent=d.codes.length;$("active").textContent=d.codes.filter(x=>x.active&&!x.expired).length;$("claims").textContent=d.claims;$("list").innerHTML=d.codes.length?d.codes.map(x=>'<article class="item"><div><div class="code">'+x.code+'</div><div class="meta">× '+x.multiplier+' · '+x.credits+' Credits · '+x.used+'/'+x.max_uses+' · '+(x.expired?'منتهي':x.active?'فعّال':'متوقف')+' · ينتهي '+new Date(x.expires_at*1000).toLocaleDateString("ar")+'</div></div><div class="actions"><button class="secondary" data-toggle="'+x.code+'">'+(x.active?'إيقاف':'تفعيل')+'</button><button class="secondary danger" data-delete="'+x.code+'">حذف</button></div></article>').join(""):'<div class="empty">لا توجد أكواد.</div>';$("status").textContent="تم تحديث البيانات."}catch(e){$("status").textContent=e.message}}
$("refresh").onclick=refresh;
$("create").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/create",{code:$("code").value.trim().toUpperCase(),multiplier:Number($("multiplier").value),credits:Number($("credits").value),max_uses:Number($("uses").value),days:Number($("days").value)});$("status").textContent="تم إنشاء الكود.";e.target.reset();$("multiplier").value=1234;$("credits").value=500;$("uses").value=100;$("days").value=7;await refresh()}catch(err){$("status").textContent=err.message}};
$("list").onclick=async e=>{const t=e.target.closest("[data-toggle]"),d=e.target.closest("[data-delete]");try{if(t)await api("/api/admin/toggle",{code:t.dataset.toggle});if(d&&confirm("حذف هذا الكود؟"))await api("/api/admin/delete",{code:d.dataset.delete});await refresh()}catch(err){$("status").textContent=err.message}};
</script></body></html>
