name: Deploy SmartCut AI Web
on:
  push:
    branches:
      - smartcut-rebuild
    paths:
      - "smartcut-web/**"
      - ".github/workflows/smartcut-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./smartcut-web"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4