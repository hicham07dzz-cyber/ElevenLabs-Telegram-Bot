name: Build SmartCut AI APK
on:
  workflow_dispatch:
  push:
    branches:
      - smartcut-apk
    paths:
      - "SmartCut_AI/**"
      - ".github/workflows/smartcut-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: SmartCut_AI
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCut-AI-debug-apk
          path: SmartCut_AI/app/build/outputs/apk/debug/app-debug.apk
